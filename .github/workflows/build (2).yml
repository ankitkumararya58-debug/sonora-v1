name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          FOUND=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FOUND" ]; then
            ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No project files and no zip found"
              ls -R | head -50
              exit 1
            fi
            mkdir project
            unzip -q "$ZIP" -d project
            FOUND=$(find project -name settings.gradle.kts | head -n 1)
          fi
          DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project folder: $DIR"

      - name: Apply Roots branding (name, icon, credit card)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p app/src/main/res/drawable
          echo '' | base64 -d > app/src/main/res/drawable/roots_logo.png
          echo '' | base64 -d > app/src/main/java/com/example/ui/components/SettingsSection.kt
          sed -i 's/text = "SONORA"/text = "Roots"/' app/src/main/java/com/example/ui/components/NowPlayingSection.kt
          sed -i 's/>SONORA</>Roots</' app/src/main/res/values/strings.xml
          sed -i 's/android:text="SONORA"/android:text="Roots"/' app/src/main/res/layout/widget_sonora_pill.xml app/src/main/res/layout/widget_sonora_card.xml
          sed -i 's/#0B0D10/#F50000/' app/src/main/res/drawable/ic_launcher_background.xml
          echo '' | base64 -d > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sonora-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
